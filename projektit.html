<!DOCTYPE html>
<html lang="fi">
<head>
<link rel="stylesheet" href="styles.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Projektit – BC Floors Oy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f8fafc;color:#1e293b;}
.hdr{background:#006CB1;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #e8a020;position:sticky;top:0;z-index:100;}
.hdr-title{color:white;font-size:12px;font-weight:700;letter-spacing:.5px;}
.hdr-sub{color:rgba(255,255,255,.6);font-size:10px;margin-top:1px;}
.content{padding:6px 16px 220px;max-width:1100px;margin:0 auto;}
#irrTarkastuksetOsio,#irrallisetOsio{max-width:1100px;margin-left:auto;margin-right:auto;}
.proj-card{background:white;border-radius:12px;border:1px solid #e2e8f0;margin-bottom:10px;overflow:visible;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.proj-main{padding:12px 14px;}
.proj-name{font-size:14px;font-weight:700;color:#1e293b;margin-bottom:2px;}
.proj-sub{font-size:12px;color:#64748b;margin-top:2px;}
.proj-actions{display:flex;border-top:1px solid #f1f5f9;flex-wrap:wrap;}
.proj-btn{flex:1;min-width:80px;padding:11px 6px;border:none;background:none;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;color:#006CB1;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px;}
.proj-btn.del{color:#ef4444;}
.proj-btn.pdf-btn{color:#10b981;}
.proj-btn:not(:last-child){border-right:1px solid #f1f5f9;}
.proj-btn:hover{background:#f8fafc;}
.tarjous-section{padding:10px 14px;background:#f8fafc;border-top:1px solid #e2e8f0;display:none;}
.tarjous-section.auki{display:block;}
.tarjous-toggle{cursor:pointer;user-select:none;}
.tarkastus-section{padding:10px 14px;background:#f0fdf4;border-top:1px solid #86efac;display:none;}
.tarkastus-section.auki{display:block;}
.tarkastus-rivi{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-top:1px solid #eef2f6;font-size:12px;}
.tarkastus-rivi:first-child{border-top:none;}
.tarkastus-rivi:last-child{border-bottom:none;}
.tark-tulos-ok{color:#16a34a;font-weight:600;}
.tark-tulos-warn{color:#92400e;font-weight:600;}
.tark-tulos-error{color:#dc2626;font-weight:600;}
.tark-pdf-btn{background:#006cb1;color:white;border:none;border-radius:5px;padding:3px 8px;font-size:10px;cursor:pointer;font-family:inherit;}
.tarjous-toggle:hover{opacity:0.8;}
.tarjous-title{font-size:11px;font-weight:700;color:#006CB1;text-transform:uppercase;letter-spacing:.3px;margin-bottom:8px;}
.hinta-rivi{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #e2e8f0;font-size:12px;}
.hinta-rivi:last-child{border-bottom:none;}
.hinta-nimi{color:#334155;flex:1;}
.hinta-arvo{color:#006CB1;font-weight:700;margin-left:8px;white-space:nowrap;}
.hinta-yksikko{color:#94a3b8;font-size:10px;margin-left:4px;}
.pdf-status{font-size:11px;padding:6px 10px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;margin-top:4px;}
.pdf-ok{background:#dcfce7;color:#15803d;}
.pdf-none{background:#f1f5f9;color:#64748b;}
.ai-loading{font-size:11px;color:#006CB1;padding:6px 0;display:flex;align-items:center;gap:6px;}
.spinner{width:14px;height:14px;border:2px solid #e2e8f0;border-top-color:#006CB1;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 20px;color:#94a3b8;font-size:14px;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e2e8f0;padding:10px 16px 14px;}
.btn-add{width:100%;padding:14px;border-radius:12px;border:none;background:#006CB1;color:white;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;justify-content:center;}
.overlay.open{display:flex;}
.sheet{background:white;border-radius:20px 20px 0 0;padding:20px 16px 36px;width:100%;max-width:500px;max-height:92vh;overflow-y:auto;animation:up .25s ease;}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-title{font-size:17px;font-weight:700;margin-bottom:16px;color:#1e293b;}
.sheet-close{float:right;background:#f1f5f9;border:none;border-radius:50%;width:28px;height:28px;font-size:15px;cursor:pointer;line-height:28px;text-align:center;}
.ff{margin-bottom:12px;}
.ff label{display:block;font-size:11px;font-weight:700;color:#006CB1;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px;}
.ff input,.ff select{width:100%;padding:11px 13px;border:1.5px solid #e2e8f0;border-radius:8px;font-family:inherit;font-size:14px;color:#1e293b;background:white;outline:none;}
.ff input:focus,.ff select:focus{border-color:#006CB1;}
.btn-save{width:100%;padding:14px;border-radius:10px;border:none;background:#006CB1;color:white;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;}
.pdf-upload-area{border:2px dashed #e2e8f0;border-radius:10px;padding:20px;text-align:center;cursor:pointer;margin-top:8px;color:#64748b;font-size:13px;}
.pdf-upload-area:hover{border-color:#006CB1;background:#f0f9ff;}
.pdf-upload-area.has-file{border-color:#10b981;background:#f0fdf4;color:#15803d;}
#pdfInput{display:none;}
.ai-info{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px;font-size:12px;color:#1d4ed8;margin-top:8px;}
.detalji-overlay{display:none;position:fixed;inset:0;background:white;z-index:300;overflow-y:auto;}
.detalji-overlay.open{display:block;}
.detalji-hdr{background:#006CB1;padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:3px solid #e8a020;position:sticky;top:0;}
.detalji-back{background:rgba(255,255,255,.2);border:none;color:white;font-size:18px;cursor:pointer;border-radius:6px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;}
.detalji-title{color:white;font-size:14px;font-weight:700;}
.detalji-content{padding:14px 16px 60px;}
.detalji-section{background:white;border-radius:10px;border:1px solid #e2e8f0;margin-bottom:10px;overflow:hidden;}
.detalji-section-title{background:#f8fafc;padding:10px 14px;font-size:11px;font-weight:700;color:#006CB1;text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid #e2e8f0;}
.detalji-row{display:flex;padding:8px 14px;border-bottom:1px solid #f1f5f9;font-size:13px;}
.detalji-row:last-child{border-bottom:none;}
.detalji-label{color:#64748b;min-width:120px;font-size:12px;}
.detalji-val{color:#1e293b;font-weight:500;flex:1;}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:white;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;}
.toast.show{opacity:1;}
.mk-section{padding:8px 14px 10px;border-top:1px solid #e2e8f0;background:#f8fafc;}
.mk-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.mk-label{font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px;}
.mk-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:12px;}
.mk-badge-none{background:#f1f5f9;color:#94a3b8;}
.mk-badge-sent{background:#dbeafe;color:#1e40af;}
.mk-badge-signed{background:#dcfce7;color:#15803d;}
.mk-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.mk-btn{font-size:11px;font-weight:600;padding:5px 10px;border-radius:6px;border:none;cursor:pointer;font-family:inherit;white-space:nowrap;}
.mk-btn-primary{background:#006CB1;color:white;}
.mk-btn-outline{background:white;color:#006CB1;border:1px solid #bfdbfe;}
.mk-btn-green{background:#16a34a;color:white;}
.mk-btn-copy{background:#f1f5f9;color:#334155;border:1px solid #e2e8f0;}
.mk-btn-danger{background:white;color:#dc2626;border:1px solid #fecaca;}

/* ── Uusi projektikortti ── */
[hidden]{display:none!important;}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #e8a020;outline-offset:2px;}
.pk-toolbar{max-width:1100px;margin:0 auto;padding:14px 16px 6px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.pk-haku{flex:1 1 260px;min-width:0;height:44px;border:1px solid #cbd5e1;border-radius:10px;padding:0 14px;font-family:inherit;font-size:14px;background:white;color:#1e293b;}
.pk-filters{display:flex;gap:8px;flex-wrap:wrap;}
.pk-filter{height:36px;padding:0 14px;border-radius:999px;border:1px solid #b9c7d6;background:white;color:#34485c;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;}
.pk-filter.on{background:#006CB1;border-color:#006CB1;color:white;}
.pk-ei-tuloksia{max-width:1100px;margin:0 auto;padding:18px 16px;color:#64748b;font-size:14px;text-align:center;}
.pk-head{padding:16px 18px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;}
.pk-title{flex:1 1 240px;min-width:0;}
.pk-toggle{display:flex;align-items:center;gap:8px;background:none;border:none;padding:0;font-family:inherit;text-align:left;color:#1e293b;cursor:pointer;max-width:100%;}
.pk-chev{flex:none;color:#006CB1;transition:transform .15s;}
.pk-toggle[aria-expanded="true"] .pk-chev{transform:rotate(90deg);}
.pk-name{font-size:17px;font-weight:700;overflow-wrap:anywhere;}
.pk-sub{margin:3px 0 0 26px;font-size:12px;color:#64748b;}
.pk-chips{display:flex;flex-wrap:wrap;gap:6px;}
.pk-chip{display:inline-block;border-radius:999px;padding:4px 11px;font-size:11px;font-weight:600;background:#e8f1fa;color:#0b5189;white-space:nowrap;}
.pk-chip-ok{background:#e7f6ec;color:#17612f;}
.pk-chip-none{background:#f1f5f9;color:#64748b;}
.pk-chip-wait{background:#fff4d6;color:#7a4b00;}
.pk-chip-draft{background:#f1f5f9;color:#475569;}
.pk-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.pk-btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;border:1px solid transparent;}
.pk-btn-primary{background:#006CB1;color:white;}
.pk-btn-primary:hover{background:#005a96;}
.pk-btn-outline{background:white;color:#0b5189;border-color:#b9c7d6;}
.pk-btn-outline:hover,.pk-btn-icon:hover{background:#eef4fa;}
.pk-btn-icon{width:38px;padding:0;justify-content:center;background:white;color:#34485c;border-color:#b9c7d6;}
.pk-menu-wrap{position:relative;}
.pk-menu{display:none;position:absolute;right:0;top:44px;z-index:30;min-width:210px;background:white;border:1px solid #cbd5e1;border-radius:10px;box-shadow:0 10px 24px rgba(15,35,55,.16);padding:6px;flex-direction:column;}
.pk-menu-wrap.open .pk-menu{display:flex;}
.pk-menu button{text-align:left;background:none;border:none;border-radius:7px;padding:11px 12px;font-family:inherit;font-size:13px;color:#1e293b;cursor:pointer;}
.pk-menu button:hover{background:#f1f5f9;}
.pk-menu .pk-menu-danger{color:#b42318;font-weight:700;}
.pk-menu-sep{height:1px;background:#e2e8f0;margin:4px 6px;}
.pk-body{border-top:1px solid #e2e8f0;background:#fafcfe;padding:4px 18px 18px;border-radius:0 0 12px 12px;}
.pk-sec{margin-top:14px;}
.pk-sec-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.pk-sec-head h3{flex:1;font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:#34485c;}
.pk-mini{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border:1px solid #b9c7d6;background:white;border-radius:8px;font-family:inherit;font-size:12px;font-weight:600;color:#0b5189;cursor:pointer;}
.pk-mini:hover{background:#eef4fa;}
.pk-list{background:white;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;}
.pk-tyhja{padding:12px 14px;font-size:12px;color:#64748b;}
.pk-rivi{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:9px 14px;border-top:1px solid #eef2f6;}
.pk-rivi:first-child{border-top:none;}
.pk-pvm{min-width:78px;font-size:12px;color:#475569;}
.pk-rivi-nimi{font-size:13px;font-weight:600;color:#1e293b;}
.pk-lisa{font-size:11px;color:#64748b;}
.pk-grow{flex:1 1 0;}
.pk-rivi-napit{display:flex;flex-wrap:wrap;gap:6px;}
.pk-hinnat{background:white;border:1px solid #e2e8f0;border-radius:10px;padding:0 14px;}
.pk-hinnat summary{cursor:pointer;padding:11px 0;font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:#34485c;}
.pk-hinnat[open] summary{border-bottom:1px solid #eef2f6;margin-bottom:4px;}
.mk-btn{min-height:32px;padding:0 12px;}
.mk-btn-icon{width:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;}
.mk-badge-draft{background:#f1f5f9;color:#475569;}
.mk-badge-sent{background:#dbeafe;color:#0b4a8f;}
.mk-badge-signed{background:#dcfce7;color:#14602d;}
@media (max-width:560px){.pk-head{padding:14px;}.pk-body{padding:4px 12px 14px;}.pk-btn{flex:1 1 auto;justify-content:center;}.pk-btn-icon{flex:none;}.pk-pvm{min-width:70px;}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>

<div class="bcf-topbar">
  <div class="bcf-topbar-left">
    <img src="logo.png" alt="BC Floors" style="height:32px;width:auto;">
    <div class="bcf-topbar-sub" style="color:rgba(255,255,255,0.7);font-size:10px;">Projektipankki</div>
  </div>
  <div class="bcf-topbar-right">
    <button onclick="asetaApiAvain()" class="bcf-btn bcf-btn-ghost bcf-btn-sm">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
      API
    </button>

</div>

<div class="pk-toolbar">
  <label for="pkHaku" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Hae projektia</label>
  <input type="search" id="pkHaku" class="pk-haku" placeholder="Hae projektia, tilaajaa tai työnumeroa…" oninput="sovellaSuodatus()" autocomplete="off">
  <div class="pk-filters">
    <button type="button" class="pk-filter on" data-filter="kaikki" aria-pressed="true" onclick="asetaSuodatin('kaikki')">Kaikki</button>
    <button type="button" class="pk-filter" data-filter="odottaa" aria-pressed="false" onclick="asetaSuodatin('odottaa')">Odottaa allekirjoitusta</button>
  </div>
</div>
<div class="pk-ei-tuloksia" id="pkTyhja" hidden>Ei hakua vastaavia projekteja.</div>
<div class="content" id="projektilista">
  <div class="empty">Ladataan projekteja...</div>
</div>
<div id="irrTarkastuksetOsio" style="display:none;padding:0 16px 12px;"><div style="background:white;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.06);"><div style="font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px;">&#128203; Tarkastukset ilman projektia</div><div id="irrTarkastuksetLista"></div></div></div>
<div id="irrallisetOsio" style="display:none;padding:0 16px 220px;"><div style="background:white;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.06);"><div style="font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px;">&#128208; Mittakirjat ilman projektia</div><div id="irrallisetLista"></div></div></div>

<div class="bottom-nav" style="display:flex;gap:10px;padding:10px;">
  <button class="bcf-btn bcf-btn-primary bcf-btn-lg" onclick="avaaLisaysSheet()" style="flex:1;justify-content:center;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Uusi projekti
  </button>
  <button class="bcf-btn bcf-btn-orange bcf-btn-lg" onclick="toggleArkisto()" id="arkistoNappi" style="flex:0 0 auto;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
    Arkisto
  </button>
</div>

<!-- Uusi projekti -sheet -->
<div class="overlay" id="lisaysOverlay">
  <div class="sheet">
    <button class="sheet-close" onclick="suljeSheet('lisaysOverlay')">✕</button>
    <div class="sheet-title">Uusi projekti</div>

      <label>Projekti / Kohde</label>
      <input type="text" id="uusiTyomaa" placeholder="esim. Akun Tehdas, Tampere">
    </div>

      <label>Tilaaja</label>

    </div>
    <div class="ff">
      <label>Työnumero</label>
      <input type="text" id="uusiTyonro" placeholder="esim. 5015">
    </div>
    <div class="ff">
      <label>Yhteyshenkilö</label>
      <input type="text" id="uusiYhteys" placeholder="esim. Markus Illikainen">
    </div>
    <div class="ff">
      <label>Osoite</label>
      <input type="text" id="uusiOsoite">

<!-- PDF-lataus olemassaolevaan projektiin -->

    <div class="ff">
      <label>&#128228; Valitse tarjous PDF</label>
      <div class="pdf-upload-area" id="uploadArea2" onclick="document.getElementById('pdfInput2').click()">
        <div>📄 Klikkaa valitaksesi PDF</div>

</div>

<script>


var projektiNimet = {};

// ── Yhteinen tarkastusrivi (projektikortti + irralliset) ──
function tarkastusRiviHtml(doc, projektinId) {
  var t = doc.data();
  var pvm = t.paivamaara ? t.paivamaara.split('-').reverse().join('.') : '';
  var tulosClass = t.tulos === 'ok' ? 'tark-tulos-ok' : t.tulos === 'warn' ? 'tark-tulos-warn' : 'tark-tulos-error';
  var tulosTxt = t.tulos === 'ok' ? '✅ Hyväksytty' : t.tulos === 'warn' ? '⚠️ Huomautuksella' : '❌ Hylätty';
  var html = '<div class="tarkastus-rivi" style="flex-direction:column;align-items:flex-start;gap:6px">';
  html += '<div style="display:flex;justify-content:space-between;width:100%;align-items:center">';
  html += '<div><div style="font-weight:600">' + pvm + (!projektinId && t.projekti ? ' – ' + t.projekti : '') + '</div>';
  html += '<div style="color:#6b7280">' + (t.valualue || '') + '</div>';
  html += '<div class="' + tulosClass + '">' + tulosTxt + '</div></div>';
  html += '<div style="display:flex;gap:4px">';
  html += '<button class="tark-pdf-btn" onclick="lataaVanhaPDF(&quot;' + doc.id + '&quot;)">PDF</button>';
  html += '<button class="tark-pdf-btn" onclick="poistaTarkastus(&quot;' + doc.id + '&quot;, &quot;' + (projektinId || '') + '&quot;)" style="background:#ef4444">🗑</button>';
  html += '</div></div>';
  if (!projektinId) {
    var opts = '<option value="">Siirrä projektille…</option>';
    Object.keys(projektiNimet).sort(function(a, b) { return projektiNimet[a].localeCompare(projektiNimet[b], 'fi'); }).forEach(function(id) {
      opts += '<option value="' + id + '">' + projektiNimet[id].replace(/</g, '&lt;') + '</option>';
    });
    html += '<select onchange="siirraTarkastus(&quot;' + doc.id + '&quot;, this)" style="width:100%;font-size:12px;padding:5px 8px;border:1px solid #86efac;border-radius:6px;background:white;color:#15803d;font-family:inherit;">' + opts + '</select>';
  }
  if (t.kuvat && t.kuvat.length > 0) {
    html += '<div style="display:flex;gap:4px;flex-wrap:wrap">';
    t.kuvat.forEach(function(url) {
      html += '<img src="' + url + '" style="width:60px;height:60px;object-fit:cover;border-radius:4px;border:1px solid #86efac;cursor:pointer" onclick="window.open(this.src)">';
    });
    html += '</div>';
  }
  html += '</div>';
  return html;
}

// ── Siirrä projektiton tarkastus projektille ──
function siirraTarkastus(tarkastusId, selectEl) {
  var projektiId = selectEl.value;
  if (!projektiId) return;
  var nimi = projektiNimet[projektiId] || '';
  if (!confirm('Siirretäänkö tarkastus projektille "' + nimi + '"?')) { selectEl.value = ''; return; }
  selectEl.disabled = true;
  db.collection('raudoitustarkastukset').doc(tarkastusId).update({ projektiId: projektiId })
    .then(function() {
      lataaProjektinTarkastukset(projektiId); // päivittää projektikortin tarkastukset ja merkin
      lataaIrrallisetTarkastukset();
    })
    .catch(function(err) {
      alert('Virhe: ' + err.message);
      selectEl.disabled = false;
      selectEl.value = '';
    });
}

// ── Tarkastukset ilman projektia ──
function lataaIrrallisetTarkastukset() {
  db.collection('raudoitustarkastukset')
    .where('projektiId', '==', null)
    .orderBy('luotu', 'desc')
    .get()
    .then(function(snap) {
      var osio = document.getElementById('irrTarkastuksetOsio');
      var lista = document.getElementById('irrTarkastuksetLista');
      if (!osio || !lista) return;
      if (snap.empty) { osio.style.display = 'none'; return; }
      osio.style.display = 'block';
      var html = '';
      snap.forEach(function(doc) { html += tarkastusRiviHtml(doc, ''); });
      lista.innerHTML = html;
    })
    .catch(function(err) {
      console.warn('Irrallisten tarkastusten haku:', err.message);
    });
}

// ── Lataa projektin tarkastukset (kortin sisältö piirtyy paivitaKortti-funktiossa) ──
var tarkastusCache = {};
function lataaProjektinTarkastukset(projektinId) {
  return db.collection('raudoitustarkastukset')
    .where('projektiId', '==', projektinId)
    .orderBy('luotu', 'desc')
    .get()
    .then(function(snap) {
      tarkCache[projektinId] = snap.docs.slice();
      paivitaKortti(projektinId);
    })
    .catch(function(err) {
      tarkCache[projektinId] = { virhe: err.message };
      paivitaKortti(projektinId);
    });
}
// Vanha nimi säilytetty: lataa projektin tarkastukset uudelleen

// ── Lataa vanha tarkastus PDF:nä suoraan ──
function lataaVanhaPDF(tarkastusId) {
  var btn = event.target;
  btn.textContent = '⏳';
  btn.disabled = true;

  db.collection('raudoitustarkastukset').doc(tarkastusId).get().then(function(doc) {
    if (!doc.exists) { btn.textContent = 'PDF'; btn.disabled = false; return; }
    var t = doc.data();
    generoimPDF(t);
    btn.textContent = 'PDF';
    btn.disabled = false;
  }).catch(function(err) {
    alert('Virhe: ' + err.message);
    btn.textContent = 'PDF';
    btn.disabled = false;
  });
}

// ── Generoi PDF Firestore-datasta ──
function generoimPDF(t) {
  var script = document.createElement('script');
  script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
  script.onload = function() { _generoimPDF(t); };
  // Jos jsPDF jo ladattu
  if (window.jspdf) { _generoimPDF(t); return; }
  document.head.appendChild(script);
}

function _generoimPDF(t) {
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
  var PW=210, PH=297, ML=14, MR=14, CW=PW-ML-MR;
  var BLUE=[0,108,177], BLUE2=[46,109,164], GRAY=[242,245,248], GBORDER=[200,208,216];
  var WHITE=[255,255,255], TEXT=[26,26,26], TEXT2=[107,114,128];
  var OK=[22,163,74], OK_BG=[240,253,244], ERR=[220,38,38], ERR_BG=[254,242,242];
  var AMBER=[146,64,14], AMBER_BG=[255,251,235], GOLD=[232,160,32];
  var y = 0;

  // HEADER
  doc.setFillColor(...BLUE);
  doc.rect(0, 0, PW, 24, 'F');
  doc.setFillColor(...GOLD);
  doc.rect(0, 24, PW, 1.2, 'F');
  doc.setTextColor(...WHITE);
  doc.setFont('helvetica','bold');
  doc.setFontSize(13);
  doc.text('VALUNALOITUSPÖYTÄKIRJA', PW-MR, 11, {align:'right'});
  doc.setFont('helvetica','normal');
  doc.setFontSize(7.5);
  doc.setTextColor(200,228,245);
  doc.text('Raudoitustarkastus  |  Laadunvarmistus', PW-MR, 17, {align:'right'});
  doc.setTextColor(...WHITE);
  doc.setFont('helvetica','bold');
  doc.setFontSize(14);
  doc.text('BC Floors', ML+2, 15);
  y = 30;

  function secTitle(title) {
    doc.setFillColor(...BLUE2);
    doc.rect(ML, y, CW, 6.5, 'F');
    doc.setTextColor(...WHITE);
    doc.setFont('helvetica','bold');
    doc.setFontSize(7.5);
    doc.text(title.toUpperCase(), ML+3, y+4.5);
    y += 6.5;
  }

  function labelValRow(pairs, widths) {
    var x = ML;
    pairs.forEach(function(p, i) {
      doc.setFillColor(...GRAY); doc.setDrawColor(...GBORDER);
      doc.rect(x, y, widths[i], 5, 'FD');
      doc.setTextColor(...BLUE2); doc.setFont('helvetica','bold'); doc.setFontSize(6.5);
      doc.text(p.label.toUpperCase(), x+2, y+3.5);
      x += widths[i];
    });
    y += 5;
    x = ML;
    pairs.forEach(function(p, i) {
      doc.setFillColor(...WHITE); doc.setDrawColor(...GBORDER);
      doc.rect(x, y, widths[i], 7.5, 'FD');
      doc.setTextColor(...TEXT); doc.setFont('helvetica','bold'); doc.setFontSize(9);
      doc.text(p.value||'', x+2, y+5.5);
      x += widths[i];
    });
    y += 7.5;
  }

  // Perustiedot
  var pvm = t.paivamaara ? t.paivamaara.split('-').reverse().join('.') : '';
  secTitle('1. Projektin perustiedot');
  labelValRow([{label:'Tilaaja',value:''},{label:'Projekti / Kohde',value:t.projekti||''}],[CW/2,CW/2]);
  labelValRow([{label:'Työnumero',value:t.tyonumero||''},{label:'Valualue / POS',value:t.valualue||''},{label:'Päivämäärä',value:pvm}],[CW*0.25,CW*0.45,CW*0.30]);
  labelValRow([{label:'Tarkastaja',value:t.tarkastaja||''},{label:'Tilaajan edustaja',value:t.tilaaja||''}],[CW/2,CW/2]);
  y += 3;

  // Tarkastuskohteet
  var checkItems = [
    {id:'alusrakenne',main:'Alusrakenne ja eristeet',sub:'Irrotuskaistat, radonsuoja, seinänsuojamuovit, laakerimuovit'},
    {id:'paaraudoitus',main:'Pääraudoitus asennettu',sub:'Verkko / teräkset oikealla korkeudella'},
    {id:'lisaraudoitus',main:'Lisäraudoitus',sub:'Korkeus ja etäisyys tarkistettu'},
    {id:'varusteet',main:'Varusteet asennettu',sub:'Kaivot, kynnysraudat, liikuntasaumat — korko tarkistettu'},
    {id:'kaadot',main:'Kaadot käyty läpi valuryhmän kanssa',sub:'Tarvittaessa merkitty maastoon'},
    {id:'betoni',main:'Betoni',sub:'Lujuusluokka, rasitusluokat, kuitumäärä/tyyppi'},
    {id:'olosuhteet',main:'Olosuhteet OK',sub:'Lämpötila yli +10°C lattian rajassa, suojaus sääilmiöiltä, riittävä ilmanvaihto ja valaistus'},
  ];
  secTitle('2. Tarkastuskohteet');
  var C1=10, C3=22, C2=CW-C1-C3;
  doc.setFillColor(227,239,250); doc.setDrawColor(...GBORDER);
  doc.rect(ML, y, CW, 5.5, 'FD');
  doc.setTextColor(...BLUE2); doc.setFont('helvetica','bold'); doc.setFontSize(7);
  doc.text('#', ML+C1/2, y+3.8, {align:'center'});
  doc.text('Tarkastuskohde', ML+C1+2, y+3.8);
  doc.text('Tulos', ML+C1+C2+C3/2, y+3.8, {align:'center'});
  y += 5.5;

  checkItems.forEach(function(item, i) {
    var st = t.tarkastuskohteet ? t.tarkastuskohteet[item.id] : null;
    var rh = 10;
    var fill = st==='ok' ? OK_BG : st==='error' ? ERR_BG : WHITE;
    doc.setFillColor(...fill); doc.setDrawColor(...GBORDER);
    doc.rect(ML, y, CW, rh, 'FD');
    var nc = st==='ok' ? OK : st==='error' ? ERR : TEXT2;
    doc.setTextColor(...nc); doc.setFont('helvetica','bold'); doc.setFontSize(8);
    doc.text(String(i+1), ML+C1/2, y+rh/2+1, {align:'center'});
    doc.setTextColor(...TEXT); doc.setFont('helvetica','bold'); doc.setFontSize(8);
    doc.text(item.main, ML+C1+2, y+4);
    doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.setTextColor(...TEXT2);
    doc.text(item.sub, ML+C1+2, y+8);
    if (st==='ok') {
      doc.setFillColor(...OK); doc.roundedRect(ML+C1+C2+2, y+2, 18, 6, 1, 1, 'F');
      doc.setTextColor(...WHITE); doc.setFont('helvetica','bold'); doc.setFontSize(6.5);
      doc.text('OK', ML+C1+C2+11, y+6.2, {align:'center'});
    } else if (st==='error') {
      doc.setFillColor(...ERR); doc.roundedRect(ML+C1+C2+2, y+2, 18, 6, 1, 1, 'F');
      doc.setTextColor(...WHITE); doc.setFont('helvetica','bold'); doc.setFontSize(6.5);
      doc.text('VIRHE', ML+C1+C2+11, y+6.2, {align:'center'});
    }
    y += rh;
  });
  y += 3;

  // Huomautukset
  secTitle('3. Huomautukset & Korjausvaatimukset');
  doc.setFillColor(...WHITE); doc.setDrawColor(...GBORDER);
  doc.rect(ML, y, CW, 16, 'FD');
  if (t.huomautukset) {
    doc.setTextColor(...TEXT); doc.setFont('helvetica','normal'); doc.setFontSize(8);
    var lines = doc.splitTextToSize(t.huomautukset, CW-6);
    doc.text(lines, ML+3, y+5);
  }
  y += 19;

  // Tulos
  secTitle('4. Tarkastuksen tulos');
  var tulosTxt = t.tulos==='ok'?'Hyväksytty — valu voidaan aloittaa':t.tulos==='warn'?'Hyväksytty huomautuksella':'Hylätty — korjattava ennen valua';
  var tBg = t.tulos==='ok'?OK_BG:t.tulos==='warn'?AMBER_BG:ERR_BG;
  var tC = t.tulos==='ok'?OK:t.tulos==='warn'?AMBER:ERR;
  var tBorder = t.tulos==='ok'?OK:t.tulos==='warn'?[245,158,11]:ERR;
  doc.setFillColor(...tBg); doc.setDrawColor(...tBorder); doc.setLineWidth(0.5);
  doc.roundedRect(ML, y, CW, 9, 1.5, 1.5, 'FD');
  doc.setTextColor(...tC); doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text(tulosTxt, ML+4, y+6);
  y += 13;

  // Allekirjoitukset
  secTitle('5. Allekirjoitukset');
  var sigW = (CW-4)/2;
  doc.setFillColor(242,245,248); doc.setDrawColor(...GBORDER);
  doc.rect(ML, y, sigW, 5, 'FD');
  doc.rect(ML+sigW+4, y, sigW, 5, 'FD');
  doc.setTextColor(...BLUE2); doc.setFont('helvetica','bold'); doc.setFontSize(6.5);
  doc.text('LATTIAURAKOITSIJA (BC FLOORS OY)', ML+2, y+3.5);
  doc.text('TILAAJA / VALVOJA', ML+sigW+6, y+3.5);
  y += 5;
  doc.setFillColor(...WHITE); doc.setDrawColor(...GBORDER);
  doc.rect(ML, y, sigW, 24, 'FD');
  doc.rect(ML+sigW+4, y, sigW, 24, 'FD');
  // Allekirjoituskuvat
  if (t.allekirjoitus1 && t.allekirjoitus1.kuva) {
    try { doc.addImage(t.allekirjoitus1.kuva, 'PNG', ML+1, y+1, sigW-2, 22); } catch(e){}
  }
  if (t.allekirjoitus2 && t.allekirjoitus2.kuva) {
    try { doc.addImage(t.allekirjoitus2.kuva, 'PNG', ML+sigW+5, y+1, sigW-2, 22); } catch(e){}
  }
  y += 24;
  doc.setFillColor(242,245,248); doc.setDrawColor(...GBORDER);
  doc.rect(ML, y, sigW, 8, 'FD');
  doc.rect(ML+sigW+4, y, sigW, 8, 'FD');
  doc.setTextColor(...TEXT2); doc.setFont('helvetica','normal'); doc.setFontSize(6.5);
  doc.text('Nimen selvennys:', ML+2, y+3.5);
  doc.setTextColor(...TEXT); doc.setFont('helvetica','bold'); doc.setFontSize(7.5);
  doc.text((t.allekirjoitus1&&t.allekirjoitus1.nimi)||'', ML+2, y+7);
  doc.setTextColor(...TEXT2); doc.setFont('helvetica','normal'); doc.setFontSize(6.5);
  doc.text('Nimen selvennys:', ML+sigW+6, y+3.5);
  doc.setTextColor(...TEXT); doc.setFont('helvetica','bold'); doc.setFontSize(7.5);
  doc.text((t.allekirjoitus2&&t.allekirjoitus2.nimi)||'', ML+sigW+6, y+7);

  // Footer
  doc.setFillColor(...BLUE2);
  doc.rect(0, PH-8, PW, 8, 'F');
  doc.setTextColor(...WHITE); doc.setFont('helvetica','normal'); doc.setFontSize(7);
  doc.text('BC Floors Oy  |  Valunaloituspöytäkirja', ML, PH-3.5);
  doc.text('Luotu: ' + new Date().toLocaleDateString('fi-FI') + '  —  Sivu 1 / 1', PW-MR, PH-3.5, {align:'right'});

  var fn = 'Valunaloituspoytakirja_' + (t.projekti||'').replace(/\s+/g,'_') + '_' + pvm + '.pdf';
  doc.save(fn);
}

          ];
          kentat.forEach(function(p) {
            var el = document.getElementById(p[0]);

function taytaKentat() {
  var tiedot = window._aiTiedot;
  if (!tiedot) return;
  var kentat = [
    ['uusiTyomaa', tiedot.tyomaa || ''],
    ['uusiTilaaja', tiedot.tilaaja || ''],
    ['uusiTyonro', tiedot.tyonro || ''],
    ['uusiYhteys', tiedot.yhteys || ''],
    ['uusiOsoite', tiedot.osoite || '']
  ];
  kentat.forEach(function(pari) {
    var el = document.getElementById(pari[0]);
    if (!el) return;
    // Korvaa elementti kokonaan uudella jolla on arvo suoraan
    var uusi = document.createElement('input');
    uusi.type = 'text';
    uusi.id = pari[0];
    uusi.style.cssText = el.style.cssText;
    uusi.className = el.className;
    uusi.defaultValue = pari[1];
    uusi.value = pari[1];
    el.parentNode.replaceChild(uusi, el);
  });
}

// ── Siivoa AI:n palauttamat hinnat: hinta aina numeroksi, tyhjät pois ──
function siistiHinnat(arr) {
  if (!Array.isArray(arr)) return [];
  return arr.map(function(h) {
    var hinta = typeof h.hinta === 'number' ? h.hinta : parseFloat(String(h.hinta).replace(/\s/g, '').replace(',', '.'));
    return { nimi: String(h.nimi || '').trim(), hinta: hinta, yksikko: h.yksikko || 'm²' };
  }).filter(function(h) { return h.nimi && isFinite(h.hinta); });
}

// ── AI lukee KAIKKI tiedot PDF:stä ──
var viimeisinAiVirhe = '';
async function lueKaikkiTiedotAIlla(pdfBase64) {
  viimeisinAiVirhe = '';
  if (!haeApiAvain()) {
    viimeisinAiVirhe = 'API-avainta ei ole asetettu tässä selaimessa/osoitteessa (' + location.host + ').';
    return null;
  }
  try {
    var response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': haeApiAvain(),
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-5-5',
        max_tokens: 8000,
        messages: [{
          role: 'user',
          content: [
            {
              type: 'document',
              source: { type: 'base64', media_type: 'application/pdf', data: pdfBase64 }
            },
            {
              type: 'text',
              text: 'Lue tästä betonilattiatarjous-PDF:stä kaikki tiedot. Palauta VAIN JSON-muodossa ilman mitään muuta tekstiä tai markdown-merkkejä:\n{\n  "tyomaa": "kohteen nimi ja paikkakunta",\n  "tilaaja": "tilaajan yritysnimi",\n  "tyonro": "työnumero",\n  "yhteys": "tilaajan yhteyshenkilön nimi",\n  "osoite": "kohteen osoite jos mainittu",\n  "hinnat": [\n    {"nimi": "Pos 1a, AP 2", "hinta": 29.30, "yksikko": "m²"},\n    ...\n  ]\n}\nSisällytä KAIKKI hinnat mukaan lukien lisä- ja muutostöiden yksikköhinnat. Jos jokin tieto puuttuu, jätä kenttä tyhjäksi merkkijonona.'
            }
          ]
        }]
      })
    });
    var data = await response.json();
    // Tarkista API-vastaus
    if (!data.content || !data.content[0]) {
      console.error('API virhe:', data);
      viimeisinAiVirhe = data.error
        ? (data.error.type || 'virhe') + ': ' + (data.error.message || '')
        : 'Tuntematon API-vastaus';
      return null;
    }
    var tekstiOsa = data.content.filter(function(b) { return b.type === 'text' && b.text; })[0];
    if (!tekstiOsa) { viimeisinAiVirhe = 'Vastauksessa ei ollut tekstiä'; return null; }
    var teksti = tekstiOsa.text.trim();
    teksti = teksti.replace(/```json|```/g, '').trim();
    var a = teksti.indexOf('{'), b = teksti.lastIndexOf('}');
    if (a >= 0 && b > a) teksti = teksti.substring(a, b + 1);
    if (data.stop_reason === 'max_tokens') console.warn('AI-vastaus katkesi max_tokens-rajaan');
    var tulos = JSON.parse(teksti);
    tulos.hinnat = siistiHinnat(tulos.hinnat);
    return tulos;
  } catch(e) {
    console.error('AI virhe:', e);
    viimeisinAiVirhe = 'Hintojen luku epäonnistui: ' + e.message;
    return null;
  }
}

// ── Vanha lueHinnatAIlla (käytössä PDF-vaihto-toiminnossa) ──
async function lueHinnatAIlla(pdfBase64) {
  var tiedot = await lueKaikkiTiedotAIlla(pdfBase64);
  return tiedot ? { hinnat: tiedot.hinnat } : null;
}

// ── Avaa PDF ──
// Näytetään sivun omassa katselimessa (iframe) + latausnappi. Pelkkä window.open(blob:) jää
// tyhjäksi, jos selaimessa on Adobe Acrobat -laajennus, joka ottaa blob-PDF:n haltuunsa.
function avaaPdf(projektinId) {
  db.collection('projects').doc(projektinId).get().then(function(doc) {
    if (!doc.exists || !doc.data().pdfBase64) return;
    var d = doc.data();
    var byteStr = atob(d.pdfBase64);
    var ab = new ArrayBuffer(byteStr.length);
    var ia = new Uint8Array(ab);
    for (var i = 0; i < byteStr.length; i++) ia[i] = byteStr.charCodeAt(i);
    var blob = new Blob([ab], {type: 'application/pdf'});
    if (window._pdfUrl) URL.revokeObjectURL(window._pdfUrl);
    var url = URL.createObjectURL(blob);
    window._pdfUrl = url;
    var tiedosto = 'Tarjous_' + (d.tyomaa || 'projekti').replace(/[^A-Za-z0-9äöåÄÖÅ-]+/g, '_') + '.pdf';
    naytaPdfNakyma(url, d.tyomaa || 'Tarjous', tiedosto);
  }).catch(function(e) { alert('PDF:n avaus epäonnistui: ' + e.message); });
}

function naytaPdfNakyma(url, otsikko, tiedosto) {
  var vanha = document.getElementById('pdfNakyma');
  if (vanha) vanha.remove();
  var o = document.createElement('div');
  o.id = 'pdfNakyma';
  o.style.cssText = 'position:fixed;inset:0;z-index:9000;background:#1a2530;display:flex;flex-direction:column;';
  var bar = document.createElement('div');
  bar.style.cssText = 'display:flex;align-items:center;gap:8px;padding:8px 12px;background:#006CB1;color:white;flex-shrink:0;';
  var t = document.createElement('div');
  t.style.cssText = 'flex:1;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
  t.textContent = '📄 ' + otsikko;
  var btnStyle = 'background:rgba(255,255,255,0.18);border:none;color:white;font-size:12px;font-weight:600;padding:7px 12px;border-radius:7px;cursor:pointer;font-family:inherit;text-decoration:none;white-space:nowrap;';
  var dl = document.createElement('a');
  dl.href = url; dl.download = tiedosto; dl.textContent = '⬇ Lataa'; dl.style.cssText = btnStyle;
  var uusi = document.createElement('a');
  uusi.href = url; uusi.target = '_blank'; uusi.rel = 'noopener'; uusi.textContent = '↗ Uusi välilehti'; uusi.style.cssText = btnStyle;
  var sulje = document.createElement('button');
  sulje.textContent = '✕ Sulje'; sulje.style.cssText = btnStyle;
  sulje.onclick = function() { o.remove(); };
  bar.appendChild(t); bar.appendChild(dl); bar.appendChild(uusi); bar.appendChild(sulje);
  var frame = document.createElement('iframe');
  frame.src = url;
  frame.style.cssText = 'flex:1;width:100%;border:none;background:white;';
  o.appendChild(bar); o.appendChild(frame);
  document.body.appendChild(o);
}

  db.collection('projects').doc(id).update({ arkistoitu: false })

}

      .then(function(){ naytaToast('🗑 Projekti poistettu'); })
      .catch(function(e){ alert('Virhe: ' + e.message); });
  }
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function fiPvm(iso) {
  if (!iso) return '';
  var d = String(iso).substring(0, 10).split('-');
  return d.length === 3 ? d[2] + '.' + d[1] + '.' + d[0] : '';
}

  if (snap.empty) {
    lista.innerHTML = '<div class="empty">Ei projekteja vielä.<br>Lisää ensimmäinen projekti!</div>';
    return;
  }

  var html = '';
  var naytettavat = [];
  projektiNimet = {};
  snap.forEach(function(doc) {
    if (!doc.data().arkistoitu) projektiNimet[doc.id] = doc.data().tyomaa || doc.id;
  });
  snap.forEach(function(doc) {
    var p = doc.data();
    var id = doc.id;
    if (!!p.arkistoitu !== arkistossa) return; // aktiivinen näkymä: ei arkistoituja, arkisto-näkymä: vain arkistoidut
    naytettavat.push(id);
    html += korttiHtml(id, p);
  });

  if (!html) {
    html = '<div class="empty">' + (arkistossa ? 'Arkisto on tyhjä.' : 'Ei aktiivisia projekteja.<br>Arkistoidut projektit löytyvät Arkisto-napista.') + '</div>';
  }
  lista.innerHTML = html;

  // Piirrä välimuistissa jo olevat tiedot heti, lataa puuttuvat
  naytettavat.forEach(function(id) {
    if (tarkCache[id] === undefined) lataaProjektinTarkastukset(id); else paivitaKortti(id);
    if (dokCache[id] === undefined) lataaProjektinDokumentit(id);
  });
  lataaKaikkiMittakirjat(naytettavat);
  sovellaSuodatus();
  kohdistaProjektiin();
}

// ── Päivitä yhden kortin merkit ja listat välimuistin tiedoista ──
function paivitaKortti(id) {
  var kortti = document.getElementById('proj-' + id);
  if (!kortti) return;
  function chip(nimi) { return kortti.querySelector('[data-chip="' + nimi + '"]'); }

  var mk = mkCache[id];
  var tark = tarkCache[id];
  var dok = dokCache[id];

  // Mittakirjat
  var mkEl = document.getElementById('mk-lista-' + id);
  if (mk) {
    chip('mk').textContent = 'Mittakirjat ' + mk.length;
    var odottaa = mk.some(function(m) { return m.tila === 'lahetetty'; });
    var luonnos = mk.some(function(m) { return m.tila !== 'lahetetty' && m.tila !== 'allekirjoitettu'; });
    chip('wait').hidden = !odottaa;
    chip('draft').hidden = !luonnos;
    kortti.dataset.odottaa = odottaa ? '1' : '0';
    if (mkEl) mkEl.innerHTML = mk.length ? mk.map(function(m) { return mkRiviHtml(id, m); }).join('') : '<div class="pk-tyhja">Ei mittakirjoja vielä.</div>';
  }

  // Tarkastukset
  var tEl = document.getElementById('tarkastukset-' + id);
  if (Array.isArray(tark)) {
    chip('tark').textContent = 'Tarkastukset ' + tark.length;
    if (tEl) tEl.innerHTML = tark.length ? tark.map(function(d) { return tarkastusRiviHtml(d, id); }).join('') : '<div class="pk-tyhja">Ei tarkastuksia vielä.</div>';
  } else if (tark && tark.virhe) {
    chip('tark').textContent = 'Tarkastukset ?';
    if (tEl) tEl.innerHTML = '<div class="pk-tyhja" style="color:#dc2626">Virhe: ' + esc(tark.virhe) + '</div>';
  }

  // Dokumentit
  var dEl = document.getElementById('dokumentit-' + id);
  if (Array.isArray(dok)) {
    chip('dok').textContent = 'Dokumentit ' + dok.length;
    if (dEl) {
      dEl.innerHTML = dok.length ? dok.map(function(x) {
        return '<div class="pk-rivi"><span class="pk-pvm">' + fiPvm(x.luotu) + '</span>' +
          '<span class="pk-rivi-nimi">' + esc(x.nimi || 'dokumentti') + '</span><span class="pk-grow"></span>' +
          '<div class="pk-rivi-napit"><button type="button" class="mk-btn mk-btn-outline" data-polku="' + esc(x.polku || '') + '" data-nimi="' + esc(x.nimi || 'tiedosto') + '" onclick="lataaStorageTiedosto(this.dataset.polku, this.dataset.nimi)">Lataa</button></div></div>';
      }).join('') : '<div class="pk-tyhja">Ei dokumentteja vielä.</div>';
    }
  } else if (dok && dok.virhe) {
    chip('dok').textContent = 'Dokumentit ?';
    if (dEl) dEl.innerHTML = '<div class="pk-tyhja" style="color:#dc2626">Virhe: ' + esc(dok.virhe) + '</div>';
  }
  sovellaSuodatus();
}

// ── Avaa / sulje kortti ──
function toggleKortti(id, pakota) {
  var body = document.getElementById('pk-body-' + id);
  var kortti = document.getElementById('proj-' + id);
  if (!body || !kortti) return;
  var auki = (typeof pakota === 'boolean') ? pakota : body.hidden;
  body.hidden = !auki;
  avoimetKortit[id] = auki;
  var btn = kortti.querySelector('.pk-toggle');
  if (btn) btn.setAttribute('aria-expanded', auki ? 'true' : 'false');
}

// ── Haku ja suodatin ──
function asetaSuodatin(f) {
  window._pkSuodatin = f;
  document.querySelectorAll('.pk-filter').forEach(function(b) {
    var on = b.dataset.filter === f;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  sovellaSuodatus();
}
function sovellaSuodatus() {
  var haku = document.getElementById('pkHaku');
  var q = ((haku && haku.value) || '').toLowerCase().trim();
  var f = window._pkSuodatin || 'kaikki';
  var kortit = document.querySelectorAll('#projektilista .proj-card');
  var nakyvia = 0;
  kortit.forEach(function(c) {
    var okHaku = !q || (c.dataset.haku || '').indexOf(q) >= 0;
    var okSuodatin = f === 'kaikki' || c.dataset.odottaa === '1';
    var nayta = okHaku && okSuodatin;
    c.style.display = nayta ? '' : 'none';
    if (nayta) nakyvia++;
  });
  var tyhja = document.getElementById('pkTyhja');
  if (tyhja) tyhja.hidden = !(kortit.length > 0 && nakyvia === 0);
}

// ── Kortin toiminnot (event delegation: ei lainausmerkkiongelmia nimissä) ──
function suljeValikot() {
  document.querySelectorAll('.pk-menu-wrap.open').forEach(function(w) {
    w.classList.remove('open');
    var b = w.querySelector('[data-act="menu"]');
    if (b) b.setAttribute('aria-expanded', 'false');
  });
}
document.addEventListener('click', function(e) {
  var el = e.target.closest('[data-act]');
  if (!e.target.closest('.pk-menu-wrap')) suljeValikot();
  if (!el) return;
  var act = el.dataset.act, id = el.dataset.id, nimi = el.dataset.nimi || '';
  if (act === 'menu') {
    var wrap = el.closest('.pk-menu-wrap');
    var avautuu = !wrap.classList.contains('open');
    suljeValikot();
    if (avautuu) { wrap.classList.add('open'); el.setAttribute('aria-expanded', 'true'); }
    return;
  }
  suljeValikot();
  if (act === 'toggle') toggleKortti(id);
  else if (act === 'avaaPdf') avaaPdf(id);
  else if (act === 'lataaPdf') avaaLataaPdf(id, nimi);
  else if (act === 'uusiMk') avaaLomake(id);
  else if (act === 'uusiTark') avaaValunaloitus(id);
  else if (act === 'tiedot') avaaDetalji(id);
  else if (act === 'arkistoi') arkistoiProjekti(id, nimi);
  else if (act === 'palauta') palautaArkistosta(id, nimi);
  else if (act === 'poista') poistaProjekti(id, nimi);
});
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') suljeValikot(); });

db.collection('projects').orderBy('tyomaa').onSnapshot(function(snap) {
  viimeisinProjektiSnap = snap;
  renderProjektit(snap);
});

// ── Vieritä ja korosta tietty projekti, kun tultu tänne mittakirjasta ("← Projektipankki") ──
var avaaKohdistusTehty = false;
function kohdistaProjektiin() {
  if (avaaKohdistusTehty) return;
  var avaaId = new URLSearchParams(window.location.search).get('avaa');
  if (!avaaId) { avaaKohdistusTehty = true; return; }
  var kortti = document.getElementById('proj-' + avaaId);
  if (!kortti) return; // projekti ei vielä renderöity — yritetään seuraavalla onSnapshot-päivityksellä
  avaaKohdistusTehty = true;
  toggleKortti(avaaId, true);
  kortti.scrollIntoView({ behavior: 'smooth', block: 'center' });
  kortti.style.transition = 'box-shadow 0.4s, border-color 0.4s';
  kortti.style.boxShadow = '0 0 0 3px #006CB1';
  kortti.style.borderColor = '#006CB1';
  setTimeout(function() {
    kortti.style.boxShadow = '';
    kortti.style.borderColor = '';
  }, 2500);
}

// ── Projektin dokumentit (esim. betonointipöytäkirjat) ──
function lataaProjektinDokumentit(projektinId) {
  return fbDb.collection('projects').doc(projektinId).collection('dokumentit').orderBy('luotu', 'desc').get()
    .then(function(snap) {
      var lista = [];
      snap.forEach(function(d) { lista.push(d.data()); });
      dokCache[projektinId] = lista;
      paivitaKortti(projektinId);
    })
    .catch(function(e) {
      dokCache[projektinId] = { virhe: e.message };
      paivitaKortti(projektinId);
    });
}

async function lataaStorageTiedosto(polku, nimi) {
  try {
    var url = await fbStorage.ref(polku).getDownloadURL();
    var a = document.createElement('a');
    a.href = url;
    a.download = nimi;
    a.target = '_blank';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  } catch(e) {
    alert('Lataus epäonnistui: ' + e.message);
  }
}


// ── Mittakirja-toiminnot ─────────────────────────────────────
var baseUrl = 'https://bcfloors1.github.io';

function lataaKaikkiMittakirjat(projektit) {
  projektit.forEach(function(id) {
    fbDb.collection('mittakirjat')
      .where('projektiId', '==', id)
      .orderBy('lahetetty', 'desc')
      .get()
      .then(function(snap) {
        var mklist = [];
        snap.forEach(function(doc) {
          var d = doc.data(); d._id = doc.id; mklist.push(d);
        });
        paivitaMkOsio(id, mklist);
      })
      .catch(function() { paivitaMkOsio(id, []); });
  });
  // Lataa myös irralliset
  lataaIrralliset();
  lataaIrrallisetTarkastukset();
}

function mkRiviHtml(projektinId, mk) {
  var mkId = mk._id;
  var pid = projektinId || '';
  var aika = mk.lahetetty ? new Date(mk.lahetetty).toLocaleDateString('fi-FI') : '';
  var badgeHtml = '';
  var napit = '';
  var trash = '<button type="button" class="mk-btn mk-btn-danger mk-btn-icon" aria-label="Poista mittakirja" title="Poista" onclick="poistaMittakirja(\'' + mkId + '\',\'' + pid + '\')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>';

  if (mk.tila === 'allekirjoitettu') {
    var allekirjAika = mk.allekirjoitettuAika ? new Date(mk.allekirjoitettuAika).toLocaleDateString('fi-FI') : '';
    badgeHtml = '<span class="mk-badge mk-badge-signed">Allekirjoitettu</span>' + (allekirjAika ? '<span class="pk-lisa">allekirjoitettu ' + allekirjAika + '</span>' : '');
    napit =
      '<button type="button" class="mk-btn mk-btn-outline" onclick="window.open(\'' + baseUrl + '/mitta-view.html?id=' + mkId + '\')">Näytä</button>' +
      '<button type="button" class="mk-btn mk-btn-green" onclick="window.open(\'' + baseUrl + '/mitta-view.html?id=' + mkId + '\')">PDF</button>' +
      '<button type="button" class="mk-btn mk-btn-outline" onclick="avaaLomake(\'' + pid + '\',\'' + mkId + '\')">Käytä pohjana</button>' +
      trash;
  } else if (mk.tila === 'lahetetty') {
    var linkki = baseUrl + '/mitta-view.html?id=' + mkId;
    badgeHtml = '<span class="mk-badge mk-badge-sent">Lähetetty</span>';
    napit =
      '<button type="button" class="mk-btn mk-btn-outline" onclick="avaaLomake(\'' + pid + '\',\'' + mkId + '\')">Muokkaa</button>' +
      '<button type="button" class="mk-btn mk-btn-copy" onclick="kopioiMkLinkki(\'' + linkki + '\')">Kopioi linkki</button>' +
      (mk.asiakasEmail ? '<button type="button" class="mk-btn mk-btn-copy" onclick="lahetaMuistutus(\'' + mkId + '\',\'' + linkki + '\')">Muistutus</button>' : '') +
      trash;
  } else {
    badgeHtml = '<span class="mk-badge mk-badge-draft">Luonnos</span>';
    napit =
      '<button type="button" class="mk-btn mk-btn-primary" onclick="avaaLomake(\'' + pid + '\',\'' + mkId + '\')">Jatka</button>' +
      trash;
  }

  return '<div class="pk-rivi">' +
    '<span class="pk-pvm">' + aika + '</span>' + badgeHtml +
    '<span class="pk-grow"></span>' +
    '<div class="pk-rivi-napit">' + napit + '</div>' +
    '</div>';
}

// Tallentaa projektin mittakirjat välimuistiin ja päivittää kortin
function paivitaMkOsio(projektinId, mklist) {
  mkCache[projektinId] = mklist || [];
  paivitaKortti(projektinId);
}

function lahetaMuistutus(mkId, linkki) {
  fbDb.collection('mittakirjat').doc(mkId).get().then(function(doc) {
    if (!doc.exists) { alert('Mittakirjaa ei löydy'); return; }
    var mk = doc.data();
    if (!mk.asiakasEmail) {
      alert('Asiakkaan sähköpostia ei ole tallennettu tähän mittakirjaan.');
      return;
    }
    if (!confirm('Lähetetäänkö muistutus osoitteeseen ' + mk.asiakasEmail + '?')) return;
    emailjs.send('service_0nh1aql', 'template_8zzbx9i', {
      asiakasEmail:    mk.asiakasEmail,
      tyomaa:          mk.tyomaa || '—',
      tilaaja:         mk.tilaaja || '—',
      linkki:          linkki
    }).then(function() {
      naytaToast('🔔 Muistutus lähetetty!');
    }).catch(function(e) {
      alert('Virhe: ' + e.message);
    });
  });
}

function avaaLomake(projektinId, mkId) {
  var url = 'mitta.html';
  if (projektinId) url += '?projekti=' + projektinId;
  if (mkId) url += (projektinId ? '&' : '?') + 'id=' + mkId;
  window.location.href = url;
}

function kopioiMkLinkki(linkki) {
  navigator.clipboard.writeText(linkki).then(function() {
    naytaToast('📋 Linkki kopioitu!');
  });
}

function poistaMittakirja(mkId, projektinId) {
  if (!confirm('Poistetaanko mittakirja? Tätä ei voi peruuttaa.')) return;
  fbDb.collection('mittakirjat').doc(mkId).delete().then(function() {
    naytaToast('🗑 Mittakirja poistettu');
    if (projektinId) {
      // Päivitä projektikortti
      fbDb.collection('mittakirjat')
        .where('projektiId', '==', projektinId)
        .orderBy('lahetetty', 'desc')
        .get()
        .then(function(snap) {
          var mklist = [];
          snap.forEach(function(doc) { var d = doc.data(); d._id = doc.id; mklist.push(d); });
          paivitaMkOsio(projektinId, mklist);
        });
    } else {
      lataaIrralliset();
    }
  }).catch(function(e) { alert('Virhe: ' + e.message); });
}

// ── Irralliset mittakirjat ───────────────────────────────────
function lataaIrralliset() {
  fbDb.collection('mittakirjat')
    .where('projektiId', '==', '')
    .orderBy('lahetetty', 'desc')
    .get()
    .then(function(snap) {
      var lista = document.getElementById('irrallisetLista');
      var osio  = document.getElementById('irrallisetOsio');
      if (!lista || !osio) return;
      osio.style.display = 'block';
      if (snap.empty) { lista.innerHTML = '<div style="font-size:12px;color:#94a3b8;padding:4px 0;">Ei mittakirjoja ilman projektia.</div>'; return; }
      var html = '';
      snap.forEach(function(doc) {
        var mk = doc.data(); mk._id = doc.id;
        html +=
          '<div style="padding:10px 0;border-bottom:1px solid #f1f5f9;">' +
            '<div style="font-size:12px;color:#334155;font-weight:600;margin-bottom:6px;">' + (mk.tyomaa || '—') + '</div>' +
            mkRiviHtml('', mk) +
          '</div>';
      });
      lista.innerHTML = html;
    })
    .catch(function() {});
}

// ── Avaa projektin detalji ──
function avaaDetalji(projektinId) {
  db.collection('projects').doc(projektinId).get().then(function(doc) {
    if (!doc.exists) return;
    var p = doc.data();
    document.getElementById('detaljitTitle').textContent = p.tyomaa || 'Projekti';

    var html = '';

    // Perustiedot
    html += '<div class="detalji-section">';
    html += '<div class="detalji-section-title">📋 Perustiedot</div>';
    if (p.tilaaja) html += '<div class="detalji-row"><span class="detalji-label">Tilaaja</span><span class="detalji-val">' + p.tilaaja + '</span></div>';
    if (p.tyonro) html += '<div class="detalji-row"><span class="detalji-label">Työnumero</span><span class="detalji-val">' + p.tyonro + '</span></div>';
    if (p.yhteys) html += '<div class="detalji-row"><span class="detalji-label">Yhteyshenkilö</span><span class="detalji-val">' + p.yhteys + '</span></div>';
    if (p.osoite) html += '<div class="detalji-row"><span class="detalji-label">Osoite</span><span class="detalji-val">' + p.osoite + '</span></div>';
    if (p.luotu) html += '<div class="detalji-row"><span class="detalji-label">Lisätty</span><span class="detalji-val">' + p.luotu.split('T')[0] + '</span></div>';
    html += '</div>';

    // Tarjous
    html += '<div class="detalji-section">';
    html += '<div class="detalji-section-title">📄 Tarjous</div>';
    if (p.pdfBase64) {
      if (p.pdfLadattu) html += '<div class="detalji-row"><span class="detalji-label">Ladattu</span><span class="detalji-val">' + p.pdfLadattu.split('T')[0] + '</span></div>';
      html += '<div class="detalji-row"><button onclick="avaaPdf(\''+doc.id+'\')" style="background:#006CB1;color:white;border:none;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;margin:4px 0">📄 Avaa tarjous PDF</button></div>';
    } else {
      html += '<div class="detalji-row"><span style="color:#94a3b8;font-size:13px">Ei tarjousta ladattu</span></div>';
    }
    html += '<div class="detalji-row"><button onclick="suljeDetalji();avaaLataaPdf(\''+doc.id+'\',\''+( p.tyomaa||'').replace(/'/g,"\\'")+'\')" style="background:#f8fafc;border:1.5px solid #e2e8f0;color:#006CB1;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;margin:4px 0">&#128228; '+(p.pdfBase64?'Vaihda PDF':'Lataa PDF')+'</button></div>';
    html += '</div>';

    // Hinnat
    if (p.tarjousHinnat && p.tarjousHinnat.length > 0) {
      html += '<div class="detalji-section">';
      html += '<div class="detalji-section-title">💰 Tarjoushinnat</div>';
      p.tarjousHinnat.forEach(function(h) {
        html += '<div class="detalji-row"><span class="detalji-label">' + h.nimi + '</span>';
        html += '<span class="detalji-val" style="color:#006CB1;font-weight:700">' + h.hinta.toFixed(2) + ' € / ' + (h.yksikko||'m²') + '</span></div>';
      });
      html += '</div>';
    }

    // Toiminnot
    html += '<div style="margin-top:16px">';
    html += '<button onclick="poistaProjekti(\''+doc.id+'\',\''+( p.tyomaa||'').replace(/'/g,"\\'")+'\')" style="width:100%;padding:12px;border-radius:10px;border:1.5px solid #fca5a5;background:white;color:#ef4444;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer">🗑 Poista projekti</button>';
    html += '</div>';

    document.getElementById('detaljitSisalto').innerHTML = html;
    document.getElementById('detaljitOverlay').classList.add('open');
  });
}

function suljeDetalji() {
  document.getElementById('detaljitOverlay').classList.remove('open');
}
</script>
